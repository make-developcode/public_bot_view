<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
    <title>MiniApp</title>
	<!--script src="https://telegram.org/js/telegram-web-app.js?59"></script-->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">
    <!-- Header -->
    <header>
		<h1 id="mainTitle" class="hero">Отправка заявки</h1>
        <img src="./image/logo.jpg" alt="Site Logo" class="wide-logo">
    </header>

    <!-- Main content -->
    <main>
        <p>Форма <strong>заказа</strong> и обратной связи</p>
        <hr>
		<!-- Table -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Товар</th>
                        <th>Цена</th>
                        <th>В наличии</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- строки будут вставлены динамически -->
                </tbody>
            </table>
        </div>

        <!-- Form -->
        <form id="contactForm" action="#" method="POST">
            <label for="name">Имя <span style="color:#d32f2f;">*</span></label>
            <input type="text" id="name" name="name"
                   placeholder="Ваше имя" required>

            <label for="email">E‑mail <span style="color:#d32f2f;">*</span></label>
            <input type="email" id="email" name="email"
                   placeholder="example@domain.com" required>

            <label for="msg">Сообщение <span style="color:#d32f2f;">*</span></label>
            <textarea id="msg" name="message" rows="4" 
                      placeholder="Введите текст сообщения..." required></textarea>

            <label for="product-select">Товар <span style="color:#d32f2f;">*</span></label>
            <select id="product-select" required>
                <option value="">Загрузка...</option>
            </select>
            <button type="submit">Отправить</button>
        </form>
		
		<!-- Индикатор загрузки -->
		<div id="loader" class="loader hidden"></div>
		<!-- Скрипт для приложения -->
        <script type="module" src="js/app.js"></script>
		
    </main>

    <!-- Footer -->
    <footer>© 2026 MiniApp MakeDeveloper</footer>
</div>

</body>
</html>
