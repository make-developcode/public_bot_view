<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MiniApp‑demo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">
    <!-- Header -->
    <header>
        <h1 id="mainTitle" class="hero">Привет, мир!</h1>
    </header>

    <!-- Main content -->
    <main>
        <p>Это мой первый <strong>HTML‑проект</strong>. Он уже содержит заголовок и абзац.</p>
        <hr>
        <!-- Logo line -->
        <p class="logo-line">
			<a href="https://mysite.org" target="_blank">MySite</a> —
			<img src="./image/logo.png" alt="my pretty site logo" width="80">
        </p>

        <!-- Table -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>Товар</th><th>Цена</th><th>В наличии</th></tr>
                </thead>
                <tbody>
                    <tr><td>Кофе</td><td>150 ₽</td><td>Да</td></tr>
                    <tr><td>Чай</td><td>120 ₽</td><td>Нет</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Form -->
        <form id="contactForm" action="#" method="POST">
            <label for="name">Имя:</label>
            <input type="text" id="name" name="name"
                   placeholder="Ваше имя" required>

            <label for="email">E‑mail:</label>
            <input type="email" id="email" name="email"
                   placeholder="example@domain.com">

            <label for="msg">Сообщение:</label>
            <textarea id="msg" name="message" rows="4"></textarea>

            <button type="submit">Отправить</button>
        </form>
		
		<!-- Индикатор загрузки -->
		<div id="loader" class="loader hidden"></div>
		
		<!--script src="app.js"></script-->
		<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
		<script> 
		document.addEventListener('DOMContentLoaded', () => {
			//добавление обработчика событий к определённому элементу DOM
			const form   = document.getElementById('contactForm');
			const loader = document.getElementById('loader');
			const btn	 = form.querySelector('button[type="submit"]')		
			let isTelegramWebApp = false; // Флаг для определения среды выполнения

			if (window.Telegram && window.Telegram.WebApp) {
				console.log('Mini App запущен в Telegram');
				isTelegramWebApp = true;				
				Telegram.WebApp.ready();	// Уведомляем Telegram, что мы готовы работать с его API
				Telegram.WebApp.expand(); // Развернуть на весь экран
				Telegram.WebApp.enableClosingConfirmation(); // Включить подтверждение закрытия
				
				const user = Telegram.WebApp.initDataUnsafe.user;
				if (user && user.first_name) {
				     form.elements.name.value = user.first_name;
				}
			}

			// Функция, показывающая индикатор
			const showLoader = () => {
				loader.classList.remove('hidden');
				btn.disabled = true;
				btn.textContent = 'Симуляция отправки...';
			};
			// Функция, скрывающая индикатор
			const hideLoader = () => {
				loader.classList.add('hidden');
				btn.disabled = false;
				btn.textContent = 'Отправить'
			};
			const simulateApiCall = async (dur = 2000) => {
				console.log('Начинаем имитацию загрузки...');
				showLoader();
				try {
					await new Promise(r => setTimeout(r, dur));
					console.log('Имитация загрузки завершена!');
				} finally {
					hideLoader();
				}
			};

			// Универсальная функция "отправки" (для обоих режимов)
			const submitFormData = async (data) => {
				console.log('Начинаем отправку данных...');
				showLoader();
				
				try {
					if (isTelegramWebApp) {
						console.log('Отправка через Telegram WebApp API:', data);
						Telegram.WebApp.sendData(JSON.stringify(data));
						Telegram.WebApp.showAlert('Данные отправлены!');
						// Telegram.WebApp.close(); // Опционально: закрыть мини-апп
					} else {
						// Режим браузера: имитируем запрос или делаем реальный fetch
						console.log('Режим отладки. Данные для отправки:', data);
						await new Promise(r => setTimeout(r, 2000)); // Имитация задержки сети
						// РЕАЛЬНАЯ ОТПРАВКА НА ВАШ СЕРВЕР (для отладки):
						// const response = await fetch('https://ваш-сервер.com/api', {
						//     method: 'POST',
						//     headers: {'Content-Type': 'application/json'},
						//     body: JSON.stringify(data)
						// });
						// const result = await response.json();
						// console.log('Ответ сервера:', result);
					}
					console.log('Отправка завершена успешно!');
				} catch (error) {
					console.error('Ошибка при отправке:', error);
					if (isTelegramWebApp) {
						Telegram.WebApp.showAlert('Произошла ошибка при отправке');
					} else {
						alert('Произошла ошибка при отправке (см. консоль)');
					}
				} finally {
					// Всегда скрываем индикатор, даже если была ошибка
					hideLoader();
				}
			};
			//e – это объект события (часто называют event).
			form.addEventListener('submit', async e => {
				e.preventDefault();
				//считать значение полей
				const data = {
					name: form.elements.name.value,
					email: form.elements.email.value,
					message: form.elements.message.value
				};
				// Простейшая валидация
				if (!data.name || !data.email || !data.message) {
					alert('Заполните все поля');
					return;
				}
				await submitFormData(data);
			});
		});
		</script>
    </main>

    <!-- Footer -->
    <footer>© 2026 MiniApp Demo</footer>
</div>

</body>
</html>
