<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
    <title>MiniApp</title>
	<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">
    <!-- Header -->
    <header>
		<h1 id="mainTitle" class="hero">Отправка заявки</h1>
        <img src="./image/logo.jpg" alt="Site Logo" class="wide-logo">
    </header>

    <!-- Main content -->
    <main>
        <p>Форма <strong>заказа</strong> и обратной связи</p>
        <hr>
		<!-- Table -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Товар</th>
                        <th>Цена</th>
                        <th>В наличии</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- строки будут вставлены динамически -->
                </tbody>
            </table>
        </div>

        <!-- Form -->
        <form id="contactForm" action="#" method="POST">
            <label for="name">Имя <span style="color:#d32f2f;">*</span></label>
            <input type="text" id="name" name="name"
                   placeholder="Ваше имя" required>

            <label for="email">E‑mail <span style="color:#d32f2f;">*</span></label>
            <input type="email" id="email" name="email"
                   placeholder="example@domain.com" required>

            <label for="msg">Сообщение <span style="color:#d32f2f;">*</span></label>
            <textarea id="msg" name="message" rows="4" 
                      placeholder="Введите текст сообщения..." required></textarea>

            <button type="submit">Отправить</button>
        </form>
		
		<!-- Индикатор загрузки -->
		<div id="loader" class="loader hidden"></div>
		
		<!--script src="app.js"></script-->
		<script> 
		document.addEventListener('DOMContentLoaded', () => {
         	// --- ДИНАМИЧЕСКАЯ ЗАГРУЗКА ТАБЛИЦЫ ---
            const tbody = document.querySelector('.table-wrapper tbody');
            const products = [
                { name: 'Кофе_', price: '150 ₽ _', inStock: 'Да_' },
                { name: 'Чай_', price: '120 ₽ _', inStock: 'Нет_' }
            ];
            products.forEach(item => {
                const row = tbody.insertRow();
                row.insertCell().textContent = item.name;
                row.insertCell().textContent = item.price;
                row.insertCell().textContent = item.inStock;
            });

			//добавление обработчика событий к определённому элементу DOM
			const form   = document.getElementById('contactForm');
			const loader = document.getElementById('loader');
			const btn	 = form.querySelector('button[type="submit"]')		
			let isTelegramWebApp = false; // Флаг для определения среды выполнения

			if (window.Telegram && window.Telegram.WebApp) {
				console.log('Mini App запущен в Telegram');
				isTelegramWebApp = true;				
				Telegram.WebApp.ready();	// Уведомляем Telegram, что мы готовы работать с его API
				Telegram.WebApp.expand(); // Развернуть на весь экран
				Telegram.WebApp.enableClosingConfirmation(); // Включить подтверждение закрытия				
				// console.log('initDataUnsafe:', Telegram.WebApp.initDataUnsafe);
				const user = Telegram.WebApp.initDataUnsafe.user;
				console.log('! Вывод json user:', user);
				if (user && user.first_name) {
					console.log('Загрузка first_name пользователя...');
				    form.elements.name.value = user.first_name;
				}
			}

			// Функция, показывающая индикатор
			const showLoader = () => {
				loader.classList.remove('hidden');
				btn.disabled = true;
				btn.textContent = 'Симуляция отправки...';
			};
			// Функция, скрывающая индикатор
			const hideLoader = () => {
				loader.classList.add('hidden');
				btn.disabled = false;
				btn.textContent = 'Отправить'
			};

			// Универсальная функция "отправки" (для обоих режимов)
			const submitFormData = async (data) => {
				console.log('Начинаем отправку данных...');
				showLoader();
				try {
					if (isTelegramWebApp) {
						console.log('Отправка через Telegram WebApp API:', data);
						Telegram.WebApp.sendData(JSON.stringify(data));
						// Даём 2 секунды на показ уведомления, потом закрываем						
						Telegram.WebApp.showAlert('Данные будут отправлены!');
						setTimeout(() => {
							Telegram.WebApp.close();
						}, 2000);
						// Telegram.WebApp.close(); // Опционально: закрыть мини-апп
					} else {
						// Режим браузера: имитируем запрос или делаем реальный fetch
						console.log('Режим отладки. Данные для отправки:', data);
						await new Promise(resolve => setTimeout(resolve, 1800)); // имитация сети
                        alert('✅ Данные успешно отправлены (симуляция)');
						// РЕАЛЬНАЯ ОТПРАВКА НА ВАШ СЕРВЕР (для отладки):
						// const response = await fetch('https://ваш-сервер.com/api', {
						//     method: 'POST',
						//     headers: {'Content-Type': 'application/json'},
						//     body: JSON.stringify(data)
						// });
						// const result = await response.json();
						// console.log('Ответ сервера:', result);
					}
					console.log('Отправка завершена успешно!');
				} catch (error) {
					console.error('Ошибка при отправке:', error);
					if (isTelegramWebApp) {
						Telegram.WebApp.showAlert('Произошла ошибка при отправке');
					} else {
						alert('Произошла ошибка при отправке (см. консоль)');
					}
				} finally {
					// Всегда скрываем индикатор, даже если была ошибка
					hideLoader();
				}
			};
			//e – это объект события (часто называют event).
			form.addEventListener('submit', async e => {
				e.preventDefault();
				//считать значение полей
				const data = {
					name: form.elements.name.value.trim(),
					email: form.elements.email.value.trim(),
					message: form.elements.message.value.trim()
				};
				// Простейшая валидация
				if (!data.name || !data.email || !data.message) {
					alert('Заполните все поля');
					return;
				}
				await submitFormData(data);
			});
		});
		</script>
    </main>

    <!-- Footer -->
    <footer>© 2026 MiniApp MakeDeveloper</footer>
</div>

</body>
</html>
